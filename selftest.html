<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Self-check — World of Trade</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#071232" />
<link rel="icon" href="world-of-trade-premium-icon-192.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
.st-wrap{max-width:820px;margin:0 auto;padding:26px 20px 80px}
.st-head{text-align:center;padding:26px 0 8px}
.st-head h1{font-size:clamp(26px,5vw,38px);margin:0 0 10px}
.st-head p{color:var(--muted);max-width:560px;margin:0 auto;font-size:16.5px;line-height:1.55}
.st-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 20px}
.st-sum{margin:0 0 18px;padding:16px 18px;border-radius:var(--r-md);text-align:center;
  font-size:18px;font-weight:700;border:3px solid transparent}
.st-sum.ok{background:linear-gradient(180deg,#2f9e69,#12492f);border-color:rgba(168,247,200,.5);color:#fff}
.st-sum.ko{background:linear-gradient(180deg,#a0243a,#5c1526);border-color:rgba(255,194,204,.5);color:#fff}
.st-sum.run{background:rgba(18,53,111,.6);border-color:rgba(255,212,92,.3);color:var(--muted)}
.st-group{margin:0 0 20px}
.st-group h2{font-size:17px;margin:0 0 9px;color:#fff8e6;
  letter-spacing:.06em;text-transform:uppercase}
.st-row{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
  padding:12px 15px;border-radius:14px;margin-bottom:7px;font-size:15.5px;line-height:1.5;
  background:rgba(18,53,111,.55);border:2px solid rgba(255,212,92,.14)}
.st-row.ko{background:rgba(160,36,58,.4);border-color:rgba(255,123,143,.55)}
.st-row.skip{opacity:.72}
.st-ico{font-size:16px;line-height:1.5;text-align:center}
.st-row.ok .st-ico{color:#a8f7c8}
.st-row.ko .st-ico{color:#ffc2cc}
.st-row.skip .st-ico{color:var(--muted-2)}
.st-name{color:#fff}
.st-detail{display:block;margin-top:3px;font-size:14px;color:#dceaff;
  word-break:break-word;font-variant-numeric:tabular-nums}
.st-frame{width:390px;height:720px;border:0;position:absolute;left:-10000px;top:0}
#stReport{width:100%;min-height:200px;margin-top:14px;padding:14px 16px;border-radius:14px;
  font:inherit;font-size:13px;line-height:1.5;color:#eaf1ff;background:rgba(4,14,40,.6);
  border:2px solid rgba(255,212,92,.2);white-space:pre;overflow:auto}
</style>
</head>
<body>

<main class="screen active">
  <div class="st-wrap">
    <div class="st-head">
      <h1>Self-check</h1>
      <p>This runs the app inside your browser and checks the things that only a real
         browser can answer: what is actually visible, real contrast, tap sizes,
         fonts, canvas, service worker. It uses a separate save, so your progress is
         not touched.</p>
    </div>

    <div class="st-bar">
      <button id="stRun" class="btn primary">Run the checks</button>
      <button id="stCopy" class="cloud-cta" style="width:auto" hidden>Copy the report</button>
    </div>

    <p id="stSum" class="st-sum run">Not run yet.</p>
    <div id="stBody"></div>
    <textarea id="stReport" readonly hidden aria-label="Report"></textarea>
  </div>
</main>

<iframe id="stFrame" class="st-frame" title="app under test" src="about:blank"></iframe>

<script src="selftest.js"></script>
</body>
</html>
