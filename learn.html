<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>World of Trade — learn physical commodity trading</title>
<meta name="description" content="Learn physical commodity trading step by step: 31 short lessons on incoterms, pricing, hedging, trade finance, execution, freight and desk risk." />
<meta name="theme-color" content="#071232" />
<link rel="icon" href="world-of-trade-premium-icon-192.png" type="image/png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="world-of-trade-premium-icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="World of Trade" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- PERCORSO -->
<main id="pathScreen" class="screen active">
  <header class="topbar">
    <a class="brand-link" href="index.html" aria-label="World of Trade — home">
      <img class="brand" src="world-of-trade-premium-logo.webp" alt="World of Trade"
           onerror="this.onerror=null;this.src='world-of-trade-premium-logo.png'" /></a>
    <div class="stats">
      <div class="stat streak" title="Day streak"><i aria-hidden="true">🔥</i><b id="statStreak">0</b></div>
      <div class="stat gold" title="Experience"><i aria-hidden="true">★</i><b id="statXp">0</b></div>
    </div>
  </header>
  <div class="wrap">
    <div class="intro">
      <h1>Learn physical commodity trading</h1>
      <p>Short lessons, from the very basics to how a merchant desk really works. Five minutes at a time.</p>
    </div>
    <div id="pathGreet"></div>
    <p id="offlineFlag" class="offline-flag" role="status" hidden></p>
    <div id="reviewHost"></div>
    <div id="pathProgress" class="course-bar" hidden>
      <div class="course-bar-top"><span id="courseLabel"></span><span id="coursePct"></span></div>
      <div class="course-track" id="courseTrack" role="progressbar" aria-label="Course progress"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="courseFill"></i></div>
    </div>
    <div id="pathBody"></div>
      <div id="installHost" class="install-host"></div>
  <p class="reset-row"><button id="resetButton" class="link-btn">Reset all progress</button></p>
  </div>
</main>

<!-- LEZIONE -->
<main id="lessonScreen" class="screen">
  <header class="lesson-top">
    <button id="quitButton" class="icon-btn" aria-label="Leave lesson">✕</button>
    <div class="progress" id="lessonProgressBar" role="progressbar" aria-label="Lesson progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="lessonProgress"></span></div>
    <div class="hearts" id="hearts" aria-label="Lives remaining"></div>
  </header>
  <div class="wrap lesson-wrap">
    <p id="runBanner" class="run-banner" hidden></p>
    <div id="exerciseArea" aria-live="polite"></div>
  </div>
  <footer class="lesson-foot">
    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <div class="wrap foot-inner">
      <button id="checkButton" class="btn primary" aria-describedby="checkHint" disabled>Check</button>
      <span id="checkHint" class="sr-only">Answer the question to continue</span>
    </div>
  </footer>
</main>

<!-- FINE LEZIONE -->
<main id="doneScreen" class="screen">
  <div class="wrap done-wrap">
    <div class="done-crest"></div>
    <h2 id="doneTitle">Lesson complete</h2>
    <p id="doneGoal" class="done-goal"></p>
    <div class="done-stats">
      <div><span>XP earned</span><strong id="doneXp">0</strong></div>
      <div><span>Accuracy</span><strong id="doneAcc">0%</strong></div>
    </div>
    <button id="continueButton" class="btn primary wide">Continue</button>
  </div>
</main>

<script src="curriculum.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
